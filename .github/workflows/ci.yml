name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B -q test

      - name: Package fat jar
        run: mvn -B -q -DskipTests package

      - name: Self test
        run: java -jar dist/coursework-tracker.jar --selftest

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: coursework-tracker
          path: target/coursework-tracker-*.jar
          if-no-files-found: error

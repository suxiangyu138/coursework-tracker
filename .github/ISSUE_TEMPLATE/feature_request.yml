name: ✨ 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请尽量说明「使用场景」，而不只是「想要什么功能」。

  - type: textarea
    id: background
    attributes:
      label: 使用场景 / 痛点
      description: 你在什么情况下需要它？现在是怎么处理的？
      placeholder: 例如：期末想把数据发给同学，只能发 db 文件，希望有导出 CSV
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望程序怎么表现？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他做法？为什么不如上面的方案？

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - 作业 / 课程管理
        - 倒计时与排序
        - 提醒与托盘
        - 统计与图表
        - 成绩 / GPA
        - 数据导入导出
        - 界面与主题
        - 其他
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 对你的重要程度
      options:
        - 有了更好
        - 比较需要
        - 非常需要
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 自查
      options:
        - label: 我已搜索过现有 Issue 与文档，未发现相同建议
          required: true
